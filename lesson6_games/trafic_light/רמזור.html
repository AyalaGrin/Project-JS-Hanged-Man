<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./רמזור.css">
</head>
<body>
<h1>trafic light</h1>
    <div class="traffic-light">
        <div id="red" class="light"></div>
        <div id="yellow" class="light"></div>
        <div id="green" class="light"></div>
    </div>

    <div class="controls">
        <button onclick="changeLight('red', '#ff0000')">אדום</button>
        <button onclick="changeLight('yellow', '#ffcc00')">צהוב</button>
        <button onclick="changeLight('green', '#00ff00')">ירוק</button>
        <button onclick="turnOff()">כיבוי</button>
    </div>

    <script src="./רמזור.js"></script>
</body>
</html>
</body>
</html>
